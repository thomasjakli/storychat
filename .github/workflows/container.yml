name: Verify and publish container

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'prototype/**'
      - 'public/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'package.json'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'prototype/**'
      - 'public/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'package.json'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Standard runners on a public repository only; do not opt private forks into billing.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Synthetic application checks
        run: node app/test.mjs
      - name: Synthetic subscription-adapter checks
        run: node prototype/test.mjs
      - name: Validate parameterized Compose
        env:
          STORYCHAT_IMAGE: storychat-ci:${{ github.sha }}
          STORYCHAT_ORIGIN: https://story.example.invalid
          STORYCHAT_PASSWORD: synthetic-ci-password-only
        run: docker compose config --quiet
      - name: Build Linux amd64 image
        run: docker build --platform linux/amd64 --tag "storychat-ci:${GITHUB_SHA}" .
      - name: Exercise actual container lifecycle and persistence
        env:
          STORYCHAT_TEST_IMAGE: storychat-ci:${{ github.sha }}
        run: node deploy/container-smoke.mjs

  publish:
    needs: verify
    if: github.event.repository.private == false && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      # Rebuild and test in this job so exactly the exercised image is published.
      # No Actions artifact upload or cache storage is required between jobs.
      - name: Build publish candidate
        run: docker build --platform linux/amd64 --tag "storychat-ci:${GITHUB_SHA}" .
      - name: Verify publish candidate
        env:
          STORYCHAT_TEST_IMAGE: storychat-ci:${{ github.sha }}
        run: node deploy/container-smoke.mjs
      - name: Publish tested commit image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "storychat-ci:${GITHUB_SHA}" "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker tag "storychat-ci:${GITHUB_SHA}" "${image}:latest"
          docker push "${image}:latest"
          printf 'Published tested image: `%s:sha-%s`\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Updated rolling tag: `%s:latest`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear temporary registry login
        if: always()
        run: docker logout ghcr.io
